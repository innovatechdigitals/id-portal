<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Innovatech Prints | Cloud ID Studio & School Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <!-- ExcelJS Browser Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

  <!-- Cropper.js for Fixed Passport Frame Positioning -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Firebase Cloud SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .clean-canvas-bg { background-color: #f8fafc; }
    .active-drag-target {
      outline: 2px dashed #2563eb !important;
      outline-offset: 2px !important;
      background-color: rgba(37, 99, 235, 0.10) !important;
    }
    .photo-guide-outline {
      outline: 1.5px dashed #3b82f6;
      outline-offset: -1px;
    }
    /* Permanently locked Passport Size (3.5 x 4.5 cm) frame: no resize handles */
    #cropperModal .cropper-point,
    #cropperModal .cropper-line {
      display: none !important;
    }
    #cropperModal .cropper-view-box {
      outline: 2.5px solid #3b82f6 !important;
      outline-offset: 0px;
    }
    body.client-mode header,
    body.client-mode #adminView {
      display: none !important;
    }
    body.client-mode {
      background: radial-gradient(circle at 50% 0%, #e0e7ff 0%, #f8fafc 100%) !important;
      min-height: 100vh;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col custom-scrollbar">

  <!-- TOP HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs px-4 lg:px-6 py-2.5 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-700 via-indigo-600 to-cyan-500 flex items-center justify-center text-white font-black text-xl shadow-md tracking-wider">
        IP
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="font-black text-slate-900 tracking-tight text-lg">Innovatech Prints</h1>
          <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Cloud Studio</span>
        </div>
        <p class="text-xs text-slate-500 font-medium hidden sm:block">Multi-School Cloud ID Management & Realtime Sync (54 × 86 mm)</p>
      </div>
    </div>

    <!-- Center Mode Switcher -->
    <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
      <button id="navAdminBtn" onclick="switchView('admin')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 bg-white text-blue-700 shadow-sm">
        <i data-lucide="sliders" class="w-3.5 h-3.5"></i>
        <span>Admin Studio</span>
      </button>
      <button id="navSchoolBtn" onclick="switchView('school')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 text-slate-600 hover:text-slate-900">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <i data-lucide="building-2" class="w-3.5 h-3.5"></i>
        <span>School Client Form</span>
      </button>
    </div>

    <!-- Right Quick Actions -->
    <div class="flex items-center space-x-2.5">
      <div class="hidden md:flex items-center space-x-1.5 bg-slate-50 border border-slate-200 px-2.5 py-1.5 rounded-lg text-xs text-slate-600">
        <i data-lucide="folder" class="w-3.5 h-3.5 text-blue-600"></i>
        <span class="font-semibold text-slate-800" id="headerSchoolName">Loading...</span>
      </div>
      <button onclick="copySchoolLink()" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-lg text-xs font-semibold flex items-center space-x-1 transition shadow-2xs">
        <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">Copy School Link</span>
      </button>
    </div>
  </header>

  <!-- ADMIN STUDIO VIEW -->
  <main id="adminView" class="flex-1 flex flex-col p-3 lg:p-4 gap-4 max-w-[1920px] w-full mx-auto">
    <div class="flex flex-col lg:flex-row gap-4 items-stretch">
      
      <!-- LEFT: INSPECTOR PANEL -->
      <section class="w-full lg:w-[680px] xl:w-[720px] shrink-0 bg-white rounded-2xl border border-slate-200 shadow-xs flex flex-col overflow-hidden">
        <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <i data-lucide="edit-3" class="w-4 h-4 text-blue-600"></i>
            <h2 class="font-bold text-slate-800 text-sm tracking-wide uppercase">Designer & Inspector Panel</h2>
          </div>
          <span class="text-[11px] font-semibold text-slate-500 bg-white px-2 py-0.5 rounded border border-slate-200">Card: 54 × 86 mm</span>
        </div>

        <div class="p-4 space-y-4 overflow-y-auto max-h-[760px] custom-scrollbar text-xs">
          <!-- Active School Selection -->
          <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200 space-y-2.5">
            <div class="flex items-center justify-between">
              <label class="font-bold text-slate-700 flex items-center space-x-1.5 uppercase tracking-wider text-[11px]">
                <i data-lucide="folder-cog" class="w-3.5 h-3.5 text-blue-600"></i>
                <span>Active School Folder</span>
              </label>
              <div class="flex items-center space-x-2">
                <button onclick="openNewSchoolModal()" class="text-blue-600 hover:text-blue-800 font-bold text-[11px] flex items-center space-x-1">
                  <i data-lucide="plus" class="w-3 h-3"></i>
                  <span>New School</span>
                </button>
                <button onclick="deleteCurrentSchool()" class="text-rose-600 hover:text-rose-800 font-bold text-[11px] flex items-center space-x-1 ml-2">
                  <i data-lucide="trash-2" class="w-3 h-3"></i>
                  <span>Delete School</span>
                </button>
              </div>
            </div>
            <select id="schoolSelect" onchange="changeActiveSchool(this.value)" class="w-full bg-white border border-slate-300 rounded-lg p-2 font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
            </select>

            <div class="pt-2 flex items-center justify-between border-t border-slate-200">
              <span class="text-slate-600 font-medium">Card Template Background (54 × 86 mm)</span>
              <label class="cursor-pointer bg-white border border-slate-300 hover:border-blue-500 text-slate-700 px-3 py-1.5 rounded-lg font-semibold flex items-center space-x-1.5 transition">
                <i data-lucide="upload-cloud" class="w-3.5 h-3.5 text-blue-600"></i>
                <span>Upload New Template</span>
                <input type="file" id="templateUploader" accept="image/*" class="hidden" onchange="handleTemplateUpload(event)">
              </label>
            </div>
          </div>

          <!-- Layers & Text Lines -->
          <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
            <div class="flex items-center justify-between">
              <label class="font-bold text-slate-700 flex items-center space-x-1.5 uppercase tracking-wider text-[11px]">
                <i data-lucide="layers" class="w-3.5 h-3.5 text-blue-600"></i>
                <span>Layers & Text Fields</span>
              </label>
              <div class="flex items-center space-x-1.5">
                <button onclick="openAddLineModal()" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-semibold flex items-center space-x-1 transition shadow-2xs">
                  <i data-lucide="plus-circle" class="w-3 h-3"></i>
                  <span>Add Line</span>
                </button>
                <button onclick="deleteSelectedLine()" id="btnDeleteLine" class="px-2 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-md font-semibold flex items-center space-x-1 transition">
                  <i data-lucide="trash" class="w-3 h-3"></i>
                  <span>Delete</span>
                </button>
              </div>
            </div>

            <select id="layerSelect" onchange="selectLayer(this.value)" class="w-full bg-white border border-slate-300 rounded-lg p-2 font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
            </select>
          </div>

          <!-- Mandatory Toggle -->
          <div id="mandatoryControls" class="p-3.5 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between">
            <div>
              <span class="font-bold text-slate-800 text-xs block">Required / Mandatory Field</span>
              <span class="text-[10px] text-slate-500">Toggle whether client must fill this field or can leave blank</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="toggleRequiredCheckbox" onchange="updateRequiredSetting(this.checked)" class="sr-only peer">
              <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w
